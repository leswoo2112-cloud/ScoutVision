<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>ScoutVision</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
<div class="wrap">

  <div class="side">
    <div class="logo">🏀 ScoutVision</div>
    <p>경기 영상 분석</p>
    <p>선수 분석</p>
    <p>슛 성공률</p>
    <p>AI 분석</p>
  </div>

  <div class="main">
    <div class="card">
      <h2>경기 영상</h2>
      <input type="file" accept="video/*" onchange="loadVideo(event)">
      <video id="video" controls></video>

<div class="videoControls">
  <button onclick="back5()">⏪ 5초</button>
  <button onclick="playPause()">▶️/⏸️</button>
  <button onclick="forward5()">5초 ⏩</button>
  <button onclick="slow()">0.5x</button>
  <button onclick="normal()">1x</button>
  <button onclick="fast()">2x</button>
</div>
    </div>

    <div class="card timeline">
      <h2>기록 타임라인</h2>
      <div id="events"></div>
    </div>
  </div>

  <div class="card">
    <h2>기록하기</h2>
    <div id="scoreboard2" class="card"></div>
<div id="players2" class="card"></div>
    <select id="team" onchange="renderPlayers2()">

    <option value="A">🔵 A팀</option>
    <option value="B">🔴 B팀</option>
</select>
<br><br>

<input id="newPlayer2" placeholder="선수 이름 입력">
<button onclick="addPlayer2()">➕ 선수 추가</button>

<br><br>
    <input id="player" placeholder="선수 이름"><br>

    <button onclick="record('2P 성공')">2P 성공</button>
    <button onclick="record('2P 실패')">2P 실패</button>
    <button onclick="record('3P 성공')">3P 성공</button>
    <button onclick="record('3P 실패')">3P 실패</button>
    <button onclick="record('FT 성공')">FT 성공</button>
    <button onclick="record('FT 실패')">FT 실패</button>
    <button onclick="record('리바운드')">리바운드</button>
    <button onclick="record('어시스트')">어시스트</button>
    <button onclick="record('스틸')">스틸</button>
    <button onclick="record('블록')">블록</button>
    <button onclick="record('턴오버')">턴오버</button>
    <button onclick="setShotMode('make')">🟢 슛 성공 위치</button>
<button onclick="setShotMode('miss')">🔴 슛 실패 위치</button>
<button onclick="clearShots()">🗑 슛맵 초기화</button>

    <h2>선수 분석</h2>
    <div class="stats" id="stats"></div>
    <div id="teamStats"></div>
    <div id="shotChart"></div>
    <div id="heatmap"></div>
<div id="mvp" class="card"></div>
<canvas id="court" width="350" height="500"></canvas>
<h2>📈 득점 흐름</h2>
<canvas id="scoreChart" width="700" height="250"></canvas>

    <h2>AI 한줄평</h2>
    <div id="ai" class="card">아직 기록 없음</div>
    <br>
      <h2>📋 경기 리포트</h2>
<div id="report2" class="card">
  아직 경기 기록이 없습니다.
</div>
<br>

<h2>📊 팀 비교</h2>

<div id="teamCompare" class="card">
    아직 경기 기록이 없습니다.
</div>

<br>
<h2>🏅 선수 랭킹</h2>

<div id="leaderboard" class="card">
    아직 기록이 없습니다.
</div>
<br>

<button onclick="saveData()">💾 저장</button>
<button onclick="loadData()">📂 불러오기</button>
<button onclick="clearShots()">🗑 숏맵 초기화</button>

<button id="undoBtn">↩ 최근 기록 취소</button>
  </div>

</div>
<script src="app.js"></script>
<script src="video.js"></script>
<script src="storage.js"></script>
<script src="players.js"></script>
<script src="stats.js"></script>
<script src="chart.js"></script>
<script src="ranking.js"></script>
<script src="heatmap.js"></script>
<script src="report.js"></script>
<script src="court.js"></script>
<!-- <script src="shotmap.js"></script> -->
<script src="courtShot.js"></script>
<script src="scoreboard2.js"></script>
<script src="players2.js"></script>
<script src="ui2.js"></script>
<script src="mvp.js"></script>
<script src="report2.js"></script>
<script src="leaderboard.js"></script>
<script src="teamCompare.js"></script>
</body>
</html>
